<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MailScope AI</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="ms-header">
    <span class="ms-logo">🛡 MailScope AI</span>
  </div>

  <div class="ms-row">
    <span class="ms-label">Gmail</span>
    <span id="ms-gmail-status" class="ms-status">● Checking…</span>
  </div>

  <div id="ms-current-block">
    <div class="ms-label" style="margin-top:10px;">Current email</div>
    <div id="ms-current-content" class="ms-current-content">Loading…</div>
  </div>

  <button id="ms-open-investigation" class="ms-btn" style="display:none;">Open Investigation</button>
  <button id="ms-scan" class="ms-btn" style="display:none;">Scan with MailScope</button>

  <div class="ms-divider"></div>

  <div class="ms-row">
    <span class="ms-label">Backend</span>
  </div>
  <input id="ms-backend-input" class="ms-input" spellcheck="false">
  <input id="ms-webapp-input" class="ms-input" spellcheck="false" style="margin-top:6px;">
  <button id="ms-save-settings" class="ms-btn ms-btn-secondary">Save Settings</button>
  <div id="ms-save-note" class="ms-note"></div>

  <div class="ms-footer">MailScope AI · SIH26106 · Prototype extension — no payment, no OAuth, analysis only on explicit scan.</div>

  <script src="popup.js"></script>
</body>
</html>
