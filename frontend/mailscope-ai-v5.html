/* ---- lightweight SVG chart helpers (no external library required) ---- */
function catmullRom2bezier(pts){
  if(pts.length<2) return '';
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} `;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x = p1.x+(p2.x-p0.x)/6, c1y = p1.y+(p2.y-p0.y)/6;
    const c2x = p2.x-(p3.x-p1.x)/6, c2y = p2.y-(p3.y-p1.y)/6;
    d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)} `;
  }
  return d;
}
// Deterministic risk-band breakdown derived from the existing analytics
// dataset (emailsAnalyzed / threatsDetected / distribution) — no new or
// randomized numbers. Mapping: Phishing -> High, Impersonation+Suspicious
// -> Medium, Fraud+Malware -> Critical, remainder of analyzed volume -> Safe.
function riskBandDistribution(a){
  const [phishing, impersonation, fraud, suspicious, malware] = a.distribution;
  const critical = fraud + malware;
  const high = phishing;
  const medium = impersonation + suspicious;
  const safe = a.emailsAnalyzed - a.threatsDetected;
  return [
    {label:'Safe', value:safe, color:'var(--mint-deep)', hex:'#22cf94'},
    {label:'Medium', value:medium, color:'var(--yellow-deep)', hex:'#f5c518'},
    {label:'High', value:high, color:'var(--peach-deep)', hex:'#ff8f33'},
    {label:'Critical', value:critical, color:'var(--terracotta-deep)', hex:'#ff4d5e'}
  ];
}
// Category totals for the selected range, summed from the same series
// used by the Threat Timeline chart — kept as the single source of truth
// so the two charts can never disagree.
function categoryTotals(a){
  const sum = arr => arr.reduce((s,v)=>s+v,0);
  return [
    {label:'Phishing', value:sum(a.phishing), hex:'#ff8f33'},
    {label:'BEC / Fraud', value:sum(a.bec), hex:'#9b6bff'},
    {label:'Impersonation', value:sum(a.imperson), hex:'#4c8dff'}
  ];
}
function animateNum(from,to,dur,onFrame){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ onFrame(to); return; }
  const start = performance.now();
  function step(now){
    const p = Math.min(1,(now-start)/dur);
    const eased = 1-Math.pow(1-p,3);
    onFrame(from+(to-from)*eased);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderTimelineSvg(a){
  const svg = document.getElementById('timelineSvg');
  if(!svg) return;
  const W=640,H=230, padL=34, padR=10, padT=14, padB=28;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const series = [
    {data:a.phishing, color:'#ff8f33', fill:'rgba(255,143,51,0.16)'},
    {data:a.bec, color:'#9b6bff', fill:'rgba(155,107,255,0.14)'},
    {data:a.imperson, color:'#4c8dff', fill:'rgba(76,141,255,0.14)'}
  ];
  const maxVal = Math.max(1, ...series.flatMap(s=>s.data)) * 1.15;
  const n = a.labels.length;
  const xFor = i => padL + (n===1 ? plotW/2 : (i/(n-1))*plotW);
  const yFor = v => padT + plotH - (v/maxVal)*plotH;

  let gridSvg = '';
  const ticks = 4;
  for(let t=0;t<=ticks;t++){
    const val = Math.round(maxVal*t/ticks);
    const y = yFor(val);
    gridSvg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
    gridSvg += `<text x="${padL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#8089ac" font-family="JetBrains Mono, monospace">${val}</text>`;
  }
  let xLabelsSvg = a.labels.map((lab,i)=>`<text x="${xFor(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#8089ac" font-family="JetBrains Mono, monospace">${lab}</text>`).join('');

  let seriesSvg = '';
  series.forEach((s,si)=>{
    const pts = s.data.map((v,i)=>({x:xFor(i), y:yFor(v)}));
    const linePath = catmullRom2bezier(pts);
    const areaPath = linePath + `L${pts[pts.length-1].x.toFixed(1)},${(padT+plotH).toFixed(1)} L${pts[0].x.toFixed(1)},${(padT+plotH).toFixed(1)} Z`;
    const dots = pts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${s.color}" class="spark-dot"></circle>`).join('');
    seriesSvg += `<path d="${areaPath}" fill="${s.fill}" stroke="none" class="spark-area" data-si="${si}"/>`;
    seriesSvg += `<path d="${linePath}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linecap="round" class="spark-line" data-si="${si}" style="color:${s.color}"/>`;
    seriesSvg += dots;
  });

  // invisible full-height hit columns, one per data point, feeding the shared custom tooltip
  let hitSvg = '';
  const colW = n>1 ? plotW/(n-1) : plotW;
  a.labels.forEach((lab,i)=>{
    const total = a.phishing[i]+a.bec[i]+a.imperson[i];
    const hx = Math.max(padL, xFor(i)-colW/2);
    const hw = n>1 ? colW : plotW;
    hitSvg += `<rect class="tl-hit" data-tt-type="timeline" data-label="${lab}" data-phish="${a.phishing[i]}" data-bec="${a.bec[i]}" data-imp="${a.imperson[i]}" data-total="${total}"
      x="${hx.toFixed(1)}" y="${padT}" width="${hw.toFixed(1)}" height="${plotH.toFixed(1)}"></rect>`;
  });

  svg.innerHTML = gridSvg + xLabelsSvg + seriesSvg + hitSvg;

  // draw-in animation: real stroke length, animated dash offset
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  svg.querySelectorAll('.spark-line').forEach((path,idx)=>{
    const len = path.getTotalLength();
    if(reduce){ path.style.strokeDasharray='none'; return; }
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.getBoundingClientRect(); // force reflow
    path.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.2,.8,.3,1) '+(idx*120)+'ms';
    requestAnimationFrame(()=>{ path.style.strokeDashoffset = '0'; });
  });
  svg.querySelectorAll('.spark-area').forEach((path,idx)=>{
    if(reduce) return;
    path.style.opacity='0';
    path.style.transition='opacity .8s ease '+(idx*120+300)+'ms';
    requestAnimationFrame(()=>{ path.style.opacity='1'; });
  });
}

function renderDonutSvg(a){
  const svg = document.getElementById('donutSvg');
  if(!svg) return;
  const bands = riskBandDistribution(a);
  const total = bands.reduce((s,b)=>s+b.value,0) || 1;
  const cx=110, cy=110, r=78, strokeW=26;
  const circumference = 2*Math.PI*r;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let offsetAcc = 0;
  let circles = '';
  bands.forEach((b,i)=>{
    const frac = b.value/total;
    const segLen = frac*circumference;
    const dashArray = `${segLen.toFixed(2)} ${(circumference-segLen).toFixed(2)}`;
    const dashOffset = -offsetAcc;
    circles += `<circle class="donut-seg" data-idx="${i}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${b.hex}" stroke-width="${strokeW}"
      stroke-dasharray="${reduce?dashArray:'0 '+circumference.toFixed(2)}" stroke-dashoffset="${dashOffset.toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})" style="color:${b.hex}" data-target="${dashArray}"
      data-tt-type="donut" data-tt-color="${b.hex}" data-label="${b.label}" data-value="${b.value}" data-pct="${(Math.round(frac*1000)/10).toFixed(1)}"></circle>`;
    offsetAcc += segLen;
  });
  svg.innerHTML = circles + `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#eef1f9">${a.emailsAnalyzed.toLocaleString()}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="#6a7396" letter-spacing="0.04em">EMAILS ANALYZED</text>`;

  if(!reduce){
    svg.querySelectorAll('.donut-seg').forEach((c,i)=>{
      const target = c.dataset.target;
      c.style.transition = 'stroke-dasharray 1s cubic-bezier(.2,.8,.3,1) '+(i*130)+'ms';
      requestAnimationFrame(()=>{ c.setAttribute('stroke-dasharray', target); });
    });
  }

  const legend = document.getElementById('donut-legend');
  if(legend){
    legend.innerHTML = bands.map(b=>`<span class="legend-item"><span class="legend-dot" style="background:${b.hex}"></span>${b.label} · ${b.value.toLocaleString()} (${Math.round(b.value/total*1000)/10}%)</span>`).join('');
  }
}

function renderBarSvg(a){
  const svg = document.getElementById('barSvg');
  if(!svg) return;
  const cats = categoryTotals(a);
  const W=500,H=190, padL=118, padR=50, padT=10, padB=10;
  const rowH = (H-padT-padB)/cats.length;
  const maxVal = Math.max(1, ...cats.map(c=>c.value));
  const plotW = W-padL-padR;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const catsTotal = cats.reduce((s,c)=>s+c.value,0) || 1;
  const bars = cats.map((c,i)=>{
    const y = padT + i*rowH + rowH*0.22;
    const h = rowH*0.56;
    const targetW = Math.max(2,(c.value/maxVal)*plotW);
    const pct = (Math.round((c.value/catsTotal)*1000)/10).toFixed(1);
    return `<g>
      <text x="${padL-12}" y="${(y+h/2+4).toFixed(1)}" text-anchor="end" font-size="12" font-weight="600" fill="#c3cadb">${c.label}</text>
      <rect x="${padL}" y="${y.toFixed(1)}" width="${reduce?targetW.toFixed(1):0}" height="${h.toFixed(1)}" rx="6" fill="${c.hex}" class="bar-rect" data-target="${targetW.toFixed(1)}" style="color:${c.hex}"
        data-tt-type="bar" data-tt-color="${c.hex}" data-label="${c.label}" data-value="${c.value}" data-pct="${pct}"></rect>
      <text x="${(padL+targetW+10).toFixed(1)}" y="${(y+h/2+4).toFixed(1)}" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#eef1f9" class="bar-label" data-x="${(padL+10).toFixed(1)}" data-final-x="${(padL+targetW+10).toFixed(1)}">${c.value.toLocaleString()}</text>
    </g>`;
  }).join('');
  svg.innerHTML = bars;

  if(!reduce){
    svg.querySelectorAll('.bar-rect').forEach((rect,i)=>{
      const target = rect.dataset.target;
      rect.style.transition = 'width .9s cubic-bezier(.2,.8,.3,1) '+(i*110)+'ms';
      requestAnimationFrame(()=>{ rect.setAttribute('width', target); });
    });
    svg.querySelectorAll('.bar-label').forEach((label,i)=>{
      label.setAttribute('x', label.dataset.x);
      label.style.transition = 'opacity .3s ease '+(i*110+700)+'ms';
      label.style.opacity='0';
      requestAnimationFrame(()=>{ label.setAttribute('x', label.dataset.finalX); label.style.opacity='1'; });
    });
  }

function bandFromScore(score){ return score>=75?'critical':score>=50?'high':score>=25?'medium':'low'; }

/* =========================================================
   INSTANT FORENSIC SNAPSHOT
   In-inbox triage layer -> full MailScope investigation.
   Reuses: /api/analyze (via MAILSCOPE.backendBase), mapApiToEmail(),
   the existing EMAILS array + 'open-case'-style navigation, and the
   existing I18N system. No parallel analysis pipeline, no fake data —
   an unanalyzed message shows a Scan CTA; only after an explicit click
   is anything sent to the backend, and the result is cached by a real
   SHA-256 fingerprint of the raw message so repeat hovers are instant
   and never re-trigger analysis.
========================================================= */
const SNAPSHOT_CACHE = new Map();      // fingerprint -> mapped email object
const SNAPSHOT_FAILED = new Set();     // fingerprint -> true if last scan failed
const _fingerprintCache = {};          // msgId -> fingerprint (computed once per message)
let snapshotHideTimer = null;
let snapshotCurrentMsgId = null;
let snapshotScanInFlight = null;       // fingerprint currently being analyzed (dedupe)

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function getMessageFingerprint(msg){
  if(_fingerprintCache[msg.id]) return _fingerprintCache[msg.id];
  const canonical = msg.raw.trim().replace(/\r\n/g,'\n');
  const fp = await sha256Hex(canonical);
  _fingerprintCache[msg.id] = fp;
  return fp;
}

function positionSnapshotCard(anchorEl){
  const card = document.getElementById('snapshot-card');
  const r = anchorEl.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  if(vw <= 720){ return; } // mobile: CSS pins it to the bottom sheet position
  const cw = 328;
  let left = r.right + 12;
  if(left + cw > vw - 12) left = Math.max(12, r.left - cw - 12);
  card.style.left = left+'px';
  const top = Math.min(Math.max(12, r.top), vh - 100); // never start so low there's no room at all
  card.style.top = top+'px';
  // The card's max-height must account for its OWN top offset, not just the
  // viewport — a fixed "100vh - 24px" cap still overflows when the card
  // starts partway down the page. Setting it here, at position time, with
  // the real top value, guarantees the whole card (however tall its content
  // is) always fits between `top` and the bottom of the viewport.
  card.style.maxHeight = Math.max(160, vh - top - 12)+'px';
}

function strengthOrEvidenceLines(mappedEmail){
  return (mappedEmail.factors||[]).slice().sort((a,b)=>b.w-a.w).slice(0,3);

function snapshotAuthRow(label, status){

  return `<div class="snap-auth-row"><span>${label}</span><span class="v" style="color:${color}">${text}</span></div>`;
}

async function openSnapshotFor(msgId, anchorEl){
  clearTimeout(snapshotHideTimer);
  snapshotCurrentMsgId = msgId;
  const msg = getInboxMessage(msgId);
  if(!msg) return;
  const card = document.getElementById('snapshot-card');
  const fp = await getMessageFingerprint(msg);
  if(snapshotCurrentMsgId !== msgId) return; // user moved on before fingerprinting finished

  if(SNAPSHOT_CACHE.has(fp)){
    card.innerHTML = snapshotReadyHTML(SNAPSHOT_CACHE.get(fp));
  } else if(SNAPSHOT_FAILED.has(fp)){
    card.innerHTML = snapshotErrorHTML(msg, fp);
  } else {
    card.innerHTML = snapshotEmptyHTML(msg, fp);
  }
  card.classList.add('show');
  positionSnapshotCard(anchorEl);
}

function scheduleSnapshotHide(){
  clearTimeout(snapshotHideTimer);
  snapshotHideTimer = setTimeout(()=>{
    document.getElementById('snapshot-card').classList.remove('show');
    snapshotCurrentMsgId = null;
  }, 220);
}
function cancelSnapshotHide(){ clearTimeout(snapshotHideTimer); }
function closeSnapshotNow(){
  clearTimeout(snapshotHideTimer);
  document.getElementById('snapshot-card').classList.remove('show');
  snapshotCurrentMsgId = null;
}

async function scanMessageWithMailscope(msgId, fp){
  const msg = getInboxMessage(msgId);
  if(!msg) return;
  const card = document.getElementById('snapshot-card');
  if(snapshotScanInFlight === fp) return; // already scanning this exact message
  snapshotScanInFlight = fp;
  card.innerHTML = snapshotLoadingHTML();
  try{
    const fd = new FormData(); fd.append('email_text', msg.raw);
    const r = await fetch(MAILSCOPE.backendBase+'/api/analyze', {method:'POST', body:fd});
    if(!r.ok){ const b = await r.json().catch(()=>({})); throw new Error(b.detail||('HTTP '+r.status)); }
    const api = await r.json();
    const mapped = mapApiToEmail(api, 'INBOX-'+msg.id);
    SNAPSHOT_CACHE.set(fp, mapped);
    SNAPSHOT_FAILED.delete(fp);
    const idx = EMAILS.findIndex(x=>x.id===mapped.id); if(idx>-1) EMAILS.splice(idx,1);
    EMAILS.push(mapped);
    snapshotScanInFlight = null;
    if(snapshotCurrentMsgId===msgId){ card.innerHTML = snapshotReadyHTML(mapped); positionSnapshotCard(document.querySelector(`.inbox-row[data-msg-id="${msgId}"]`)||card); }
  }catch(err){
    SNAPSHOT_FAILED.add(fp);
    snapshotScanInFlight = null;
    if(snapshotCurrentMsgId===msgId){ card.innerHTML = snapshotErrorHTML(msg, fp); }
  }
}

function wireInboxSnapshots(){
  const list = document.getElementById('inbox-list');
  if(!list) return;
  const isHoverCapable = window.matchMedia('(hover: hover)').matches;
  list.querySelectorAll('.inbox-row').forEach(row=>{
    const msgId = row.dataset.msgId;
    if(isHoverCapable){
      row.addEventListener('mouseenter', ()=>openSnapshotFor(msgId, row));
      row.addEventListener('mouseleave', scheduleSnapshotHide);
      row.addEventListener('focus', ()=>openSnapshotFor(msgId, row));
      row.addEventListener('blur', scheduleSnapshotHide);
    } else {
      row.addEventListener('click', ()=>{
        if(snapshotCurrentMsgId===msgId){ closeSnapshotNow(); } else { openSnapshotFor(msgId, row); }
      });
    }
    row.addEventListener('keydown', e=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openSnapshotFor(msgId, row); }
    });
  });
  list.querySelectorAll('.inbox-shield-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.stopPropagation(); const msgId=btn.dataset.msgId; openSnapshotFor(msgId, btn.closest('.inbox-row')); });
  });
}

// Converts a real /api/analyze JSON response into the same object shape the
// existing resultsHTML()/reportHTML() UI already renders, so the forensic
// report and investigation screens need no visual changes at all.
function mapApiToEmail(api, id){
  const risk = Math.round(api.risk_score||0);
  const classLabel = {benign:'Safe', suspicious:'Suspicious', phishing:'Phishing', impersonation:'Impersonation', fraud:'Fraud', malware:'Malware'}[api.classification] || 'Suspicious';
  const infra = (api.infrastructure && api.infrastructure[0]) || null;
  const hops = (api.relay_path||[]).map((h,i)=>({n:i+1, title:h.from_host||('Hop '+(i+1)), sub:h.by_host?('Delivered by '+h.by_host):'Observed relay', ip:(h.public_ips_observed&&h.public_ips_observed[0])||'unavailable'}));
  return {
    id, sender: api.headers.from || 'unknown-sender', subject: api.headers.subject || '(no subject detected)', time:'Just now',
    classification: classLabel, band: bandFromScore(risk), score: risk, confidence: api.confidence||0, detailed:true,
    messageId: api.headers.message_id || 'unavailable', from: api.headers.from||'unavailable', replyTo: api.headers.reply_to||'unavailable', returnPath: api.headers.return_path||'unavailable',
    hops: hops.length ? hops : [{n:1,title:'Relay path unavailable',sub:'No Received headers were present to reconstruct a path',ip:'unavailable'}],
    auth: {spf:api.authentication.spf, dkim:api.authentication.dkim, dmarc:api.authentication.dmarc},
    factors: (api.signals||[]).map(s=>({l:s.explanation, w:Math.round(s.weight)})),
    aiSummary: (api.signals&&api.signals.length) ? `This assessment combines ${api.signals.length} observed signal(s) across headers, authentication, URLs and content analysis. ` + (api.content_analysis.nlp_model_status==='not_loaded' ? 'Content analysis used a placeholder keyword heuristic, not a trained model.' : 'Content analysis used the configured NLP model.') : 'No notable risk signals were observed in this message.',
    keyEvidence: (api.signals||[]).map(s=>s.explanation),
    urls: (api.urls||[]).map(u=>({url:u.url, domain:u.domain||'unavailable', risk:(u.lookalike_of||u.is_ip_based)?'high':(u.notes&&u.notes.length?'medium':'low'), reasons:u.notes||[]})),
    attachments: (api.attachments||[]).map(a=>({name:a.filename, hash:(a.sha256||'unavailable'), type:a.mime_type||'unavailable', verdict:(a.indicators&&a.indicators.length)?a.indicators.join('; '):'No indicators observed'})),
    analysisTimestamp: (api.evidence&&api.evidence.analysis_timestamp) || null,
    contentSnippet: (api.content_analysis.matched_terms&&api.content_analysis.matched_terms.length) ? 'Matched terms: '+api.content_analysis.matched_terms.join(', ') : '(Content body is not stored; only extracted indicators are shown here for privacy.)',
    suspiciousPhrases: api.content_analysis.matched_terms||[],
    origin:{route:hops.map(h=>({name:h.title, detail:h.ip})), confidence: api.confidence||0},
    geo: infra ? {country:infra.country, city:infra.city, isp:infra.isp, asn:infra.asn, hosting:infra.hosting, vpnTor:infra.vpn_proxy_tor, confidence:api.confidence||0, x:50, y:50} : {country:'unavailable', city:'unavailable', isp:'unavailable', asn:'unavailable', hosting:'unavailable', vpnTor:'unavailable', confidence:0, x:50, y:50},
    campaignId: (api.campaign&&api.campaign.campaign_id) || null, caseId: api.case_id, analystStatus:null,
    limitations: api.limitations||[], liveResult:true, timeline: api.timeline||[],
    relatedActivity: api.related_activity || {locked:true, related_cases:[]},
  };
}

// Shared local heuristic classifier — DEMO MODE ONLY (used only when no
// backend is reachable). Never presented as a real analysis result.
function classifyRawEmail(raw){
  const fromMatch = raw.match(/^From:\s*(.+)$/im);
  const subjMatch = raw.match(/^Subject:\s*(.+)$/im);
  const msgIdMatch = raw.match(/^Message-ID:\s*(.+)$/im);
  const sender = fromMatch ? fromMatch[1].trim() : 'unknown-sender@unverified.example';
  const subject = subjMatch ? subjMatch[1].trim() : 'Pasted email (no subject line detected)';
  const lower = raw.toLowerCase();
  let band='low', score=6, classification='Safe';
  if(/verify|password|credential|login|urgent|suspend/.test(lower)){ band='critical'; score=87; classification='Phishing'; }
  else if(/invoice|payment|bank|wire/.test(lower)){ band='high'; score=72; classification='Fraud'; }
  else if(/interview|internship|shortlisted|offer/.test(lower) && /verify|confirm|link|click/.test(lower)){ band='high'; score=76; classification='Impersonation'; }
  return {sender, subject, msgId: msgIdMatch ? msgIdMatch[1].trim() : null, band, score, classification};
}

// Runs the existing 9-step pipeline animation while a REAL async analysis
// (fetchPromise) is in flight. The animation is purely visual — the result
// shown afterwards always comes from fetchPromise's resolved value, never
// from a timer. On failure, shows an inline error instead of fake results.
function runPipelineLive(fetchPromise, onSuccess){
  document.getElementById('results-wrap').innerHTML = '';
  document.getElementById('pipeline-wrap').innerHTML = pipelineHTML();
  sound.startProcessing();
  const n = 9, stepDur = 210;
  for(let i=0;i<n-1;i++){
    setTimeout(()=>{
      const el = document.getElementById('pstep-'+i);
      if(el) el.classList.add('active');
      if(i>0){ const prev = document.getElementById('pstep-'+(i-1)); if(prev){ prev.classList.remove('active'); prev.classList.add('done'); } }
    }, i*stepDur);
  }
  const minAnimTime = new Promise(res=>setTimeout(res, (n-1)*stepDur));
  Promise.allSettled([fetchPromise, minAnimTime]).then(([result])=>{
    const lastActive = document.getElementById('pstep-'+(n-2));
    if(lastActive){ lastActive.classList.remove('active'); lastActive.classList.add('done'); }
    const lastEl = document.getElementById('pstep-'+(n-1));
    if(lastEl){ lastEl.classList.add('done'); }
    sound.stopProcessing();
    if(result.status==='fulfilled'){
      onSuccess(result.value);
    } else {
      document.getElementById('results-wrap').innerHTML = `<div class="card" style="padding:22px 26px;border-color:var(--peach-deep);">
        <div class="section-title" style="color:var(--peach-deep);">Analysis failed</div>
        <p style="font-size:13px;color:var(--text-secondary);margin-top:8px;">Could not reach the MailScope backend at <code>${MAILSCOPE.backendBase}</code>. ${result.reason&&result.reason.message?result.reason.message:''}
        You can switch to Demo Mode from the sidebar to explore the interface offline, or start the backend and try again.</p>
      </div>`;
      sound.alertTone && sound.alertTone();
    }
  });
}

// Privacy note: the raw pasted/uploaded text is sent ONLY to the local
// MailScope backend for parsing/analysis (never to a third party as raw
// content), and only in LIVE mode with the user's explicit action. In DEMO
// mode nothing is sent anywhere — analysis is a local, clearly-labeled heuristic.
function handlePastedEmail(rawText){
  if(MAILSCOPE.liveMode && MAILSCOPE.backendStatus==='online'){
    const fd = new FormData(); fd.append('email_text', rawText);
    const p = fetch(MAILSCOPE.backendBase+'/api/analyze', {method:'POST', body:fd}).then(r=>{ if(!r.ok) return r.json().then(b=>{throw new Error(b.detail||('HTTP '+r.status));}); return r.json(); });
    runPipelineLive(p, api=>{
      const e = mapApiToEmail(api, 'EM-LIVE');
      const idx = EMAILS.findIndex(x=>x.id==='EM-LIVE'); if(idx>-1) EMAILS.splice(idx,1);
      EMAILS.push(e); state.activeEmailId = e.id;
      document.getElementById('results-wrap').innerHTML = resultsHTML(e);
      document.getElementById('results-wrap').scrollIntoView({behavior:'smooth',block:'start'});
      if(window.animateCounters) window.animateCounters();
      if(e.band==='high'||e.band==='critical'){ sound.alertTone(); } else { sound.confirmChime(); }
    });
    return;
  }
  // DEMO fallback
  const c = classifyRawEmail(rawText);
  const pasteEmail = {id:'EM-PASTE-DEMO', sender:c.sender, subject:'[DEMO] '+c.subject, time:'Just now', classification:c.classification, band:c.band, score:c.score, confidence: Math.min(95,60+Math.round(c.score/3))};
  const detail = generateFallback(pasteEmail);
  if(c.msgId) detail.messageId = c.msgId;
  Object.assign(pasteEmail, detail);
  const existingIdx = EMAILS.findIndex(x=>x.id==='EM-PASTE-DEMO');
  if(existingIdx>-1) EMAILS.splice(existingIdx,1);
  EMAILS.push(pasteEmail);
  runPipeline('EM-PASTE-DEMO');
}

function handleUpload(file){
  const reader = new FileReader();

    uploadedRaw = ev.target.result;

    if(MAILSCOPE.liveMode && MAILSCOPE.backendStatus==='online'){
      const fd = new FormData(); fd.append('file', file, file.name);
      const p = fetch(MAILSCOPE.backendBase+'/api/analyze', {method:'POST', body:fd}).then(r=>{ if(!r.ok) return r.json().then(b=>{throw new Error(b.detail||('HTTP '+r.status));}); return r.json(); });
      runPipelineLive(p, api=>{
        const e = mapApiToEmail(api, 'EM-UPLOAD');
        const idx = EMAILS.findIndex(x=>x.id==='EM-UPLOAD'); if(idx>-1) EMAILS.splice(idx,1);
        EMAILS.push(e); state.activeEmailId = e.id;
        document.getElementById('results-wrap').innerHTML = resultsHTML(e);
        document.getElementById('results-wrap').scrollIntoView({behavior:'smooth',block:'start'});
        if(window.animateCounters) window.animateCounters();
        if(e.band==='high'||e.band==='critical'){ sound.alertTone(); } else { sound.confirmChime(); }
      });
      return;
    }
    // DEMO fallback
    const c = classifyRawEmail(uploadedRaw);
    const subject = '[DEMO] ' + (c.subject.startsWith('Pasted email') ? file.name : c.subject);
    const uploadEmail = {id:'EM-UPLOAD-DEMO', sender:c.sender, subject, time:'Just now', classification:c.classification, band:c.band, score:c.score, confidence: Math.min(95,60+Math.round(c.score/3))};
    const detail = generateFallback(uploadEmail);
    if(c.msgId) detail.messageId = c.msgId;
    Object.assign(uploadEmail, detail);
    const existingIdx = EMAILS.findIndex(x=>x.id==='EM-UPLOAD-DEMO');
    if(existingIdx>-1) EMAILS.splice(existingIdx,1);
    EMAILS.push(uploadEmail);
    runPipeline('EM-UPLOAD-DEMO');
  };
  reader.readAsText(file);
}

/* =========================================================
   EXTENSION DEEP LINK — ?case=CASE_ID
   Lets the Chrome extension's "View Full Investigation" button open this
   SAME existing investigation UI from a separate browser tab/context. It
   does not reimplement risk/classification/evidence — it fetches the
   case from the EXISTING GET /api/reports/{case_id} endpoint, reshapes
   that response back into the exact object shape /api/analyze already
   returns, and hands it to the EXISTING mapApiToEmail() + resultsHTML().
========================================================= */
function reportToApiShape(report){
  return {
    case_id: report.case_id, classification: report.summary.classification,
    risk_score: report.summary.risk_score, confidence: report.summary.confidence, mode: report.summary.mode,
    signals: report.key_findings || [],
    content_analysis: {nlp_model_status: report.engine.nlp_model_status, nlp_model_version: report.engine.nlp_model_version, label:'', probabilities:{}, matched_terms:[]},
    headers: report.headers || {}, authentication: report.authentication || {}, urls: report.urls || [],
    domains: report.domain_intelligence || [], infrastructure: report.network_intelligence || [],
    relay_path: report.relay_path || [], campaign: report.campaign || {}, evidence: report.evidence || {},
    limitations: report.limitations || [], timeline: report.timeline || [], attachments: report.attachments || [],
    identity: report.identity || {}, relay_chain_reliability: report.relay_chain_reliability || {},
    forensic_findings: report.forensic_findings || [], language: report.language || {},
    related_activity: report.related_activity || {locked:true, related_cases:[]},
  };
}
async function openCaseFromDeepLink(caseId){
  state.page='investigate'; render();
  const rw = document.getElementById('results-wrap');
  try{
    const r = await fetch(MAILSCOPE.backendBase+'/api/reports/'+encodeURIComponent(caseId));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const report = await r.json();
    const mapped = mapApiToEmail(reportToApiShape(report), caseId);
    const idx = EMAILS.findIndex(x=>x.id===caseId); if(idx>-1) EMAILS.splice(idx,1);
    EMAILS.push(mapped);
    state.activeEmailId = caseId; render();
    setTimeout(()=>{ const rw2=document.getElementById('results-wrap'); if(rw2){ rw2.innerHTML = resultsHTML(mapped); if(window.animateCounters) window.animateCounters(); } },30);
  }catch(err){
    if(rw) rw.innerHTML = `<div class="card" style="padding:22px 26px;border-color:var(--peach-deep);"><div class="section-title" style="color:var(--peach-deep);">Case not found</div><p style="font-size:13px;color:var(--text-secondary);margin-top:8px;">Could not load case '${caseId}' from the backend at ${MAILSCOPE.backendBase}. It may have expired from the in-memory case store, or the backend may be unreachable.</p></div>`;
  }
}

/* =========================================================
   AMBIENT FX — dynamic particle background, cursor glow,
   animated counters, chart tooltips.
   Centralized lifecycle: every loop below is started exactly
   ONCE at load, pauses when the tab is hidden, and respects
   prefers-reduced-motion. Nothing here is re-created on page
   navigation, so switching tabs never spawns duplicate loops
   or duplicate listeners.
========================================================= */
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let tabHidden = document.hidden;
  document.addEventListener('visibilitychange', ()=>{ tabHidden = document.hidden; });

  // ---- Cursor glow trail + reactive dot/ring pointer (native cursor stays visible) ----
  const glow = document.getElementById('cursor-glow');
  const ring = document.getElementById('cursor-ring');
  const dot = document.getElementById('cursor-dot');
  if(glow && ring && dot){
    let mx=window.innerWidth/2, my=window.innerHeight/2, gx=mx, gy=my, rx=mx, ry=my;
    window.addEventListener('mousemove', e=>{
      mx=e.clientX; my=e.clientY;
      dot.style.left = mx+'px'; dot.style.top = my+'px';
    }, {passive:true});
    window.addEventListener('mousedown', ()=>ring.classList.add('press'));
    window.addEventListener('mouseup', ()=>ring.classList.remove('press'));
    if(reduceMotion){
      window.addEventListener('mousemove', e=>{
        glow.style.transform='translate3d('+e.clientX+'px,'+e.clientY+'px,0)';
        ring.style.left = e.clientX+'px'; ring.style.top = e.clientY+'px';
      }, {passive:true});
    } else {
      // ONE requestAnimationFrame loop for the whole app's cursor trail
      (function cursorLoop(){
        if(!tabHidden){
          gx += (mx-gx)*0.14; gy += (my-gy)*0.14;
          rx += (mx-rx)*0.22; ry += (my-ry)*0.22;
          glow.style.transform = 'translate3d('+gx.toFixed(1)+'px,'+gy.toFixed(1)+'px,0)';
          ring.style.left = rx.toFixed(1)+'px'; ring.style.top = ry.toFixed(1)+'px';
        }
        requestAnimationFrame(cursorLoop);
      })();
    }

    // hover reactivity: shape + color + glow shift depending on what's underneath
    const HOVER_SEL = 'a,button,[data-action],[data-nav],.card,tr.clickable,.badge,.journey-node,.graph-node,.campaign-card,select,.toggle,.nav-item,.evidence-chip,.auth-chip,input[type=file]+.dropzone,.dropzone';
    function accentFor(el){
      if(el.classList.contains('b-critical')) return {c:'#ff4d5e', bg:'rgba(255,77,94,0.14)'};
      if(el.classList.contains('b-high')) return {c:'#ff8f33', bg:'rgba(255,143,51,0.14)'};
      if(el.classList.contains('b-medium')) return {c:'#f5c518', bg:'rgba(245,197,24,0.14)'};
      if(el.classList.contains('b-safe')) return {c:'#22cf94', bg:'rgba(34,207,148,0.14)'};
      if(el.classList.contains('btn-primary')) return {c:'#9b6bff', bg:'rgba(155,107,255,0.16)'};
      if(el.classList.contains('graph-node')) return {c: el.style.color || '#4c8dff', bg:'rgba(76,141,255,0.12)'};
      if(el.classList.contains('journey-node')) return {c:'#4c8dff', bg:'rgba(76,141,255,0.14)'};
      return {c:'#4c8dff', bg:'rgba(76,141,255,0.12)'};
    }
    document.addEventListener('mouseover', e=>{
      const t = e.target.closest(HOVER_SEL);
      if(!t) return;
      const {c,bg} = accentFor(t);
      ring.style.borderColor = c;
      ring.style.background = bg;
      ring.style.boxShadow = '0 0 26px '+bg;
      ring.classList.add('expand');
      ring.classList.toggle('shape-square', t.classList.contains('dropzone'));
      dot.style.background = c;
      dot.style.boxShadow = '0 0 12px '+c;
    });
    document.addEventListener('mouseout', e=>{
      const t = e.target.closest(HOVER_SEL);
      if(!t) return;
      ring.classList.remove('expand','shape-square');
      ring.style.borderColor = ''; ring.style.background=''; ring.style.boxShadow='';
      dot.style.background = ''; dot.style.boxShadow = '';
    });
  }

  // ---- Constellation particle background — ONE canvas, ONE rAF loop, paused when tab hidden ----
  const canvas = document.getElementById('bg-canvas');
  if(canvas){
    const ctx = canvas.getContext('2d');
    let w,h,particles=[], resizeTimer=null;
    function seedParticles(){
      const count = Math.max(14, Math.min(w<640?22:55, Math.floor((w*h)/30000)));
      particles = [];
      const hues = [[111,168,255],[183,155,255],[95,224,180]];
      for(let i=0;i<count;i++){
        const isHub = Math.random() < 0.22;
        particles.push({
          x:Math.random()*w, y:Math.random()*h,
          vx:(Math.random()-0.5)*0.18, vy:(Math.random()-0.5)*0.18,
          hue:hues[i%hues.length], r: isHub ? (5+Math.random()*3.5) : (2+Math.random()*2), hub:isHub,
          alpha: isHub ? 0.9 : 0.4+Math.random()*0.35
        });
      }
    }
    function resize(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; seedParticles(); }
    window.addEventListener('resize', ()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(resize,150); }, {passive:true});
    resize();
    function sphere(p){
      if(p.hub){
        const halo = ctx.createRadialGradient(p.x,p.y,p.r*0.4,p.x,p.y,p.r*3.2);
        halo.addColorStop(0, 'rgba('+p.hue.join(',')+',0.16)');
        halo.addColorStop(1, 'rgba('+p.hue.join(',')+',0)');
        ctx.fillStyle = halo;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*3.2,0,Math.PI*2); ctx.fill();
      }
      const g = ctx.createRadialGradient(p.x-p.r*0.35,p.y-p.r*0.4,p.r*0.15, p.x,p.y,p.r*1.15);
      g.addColorStop(0, 'rgba(235,242,255,'+p.alpha+')');
      g.addColorStop(0.45, 'rgba('+p.hue.join(',')+','+p.alpha+')');
      g.addColorStop(1, 'rgba('+Math.round(p.hue[0]*0.45)+','+Math.round(p.hue[1]*0.45)+','+Math.round(p.hue[2]*0.55)+','+(p.alpha*0.9)+')');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    function tick(){
      if(!tabHidden){
        ctx.clearRect(0,0,w,h);
        particles.forEach(p=>{
          p.x+=p.vx; p.y+=p.vy;
          if(p.x<0||p.x>w) p.vx*=-1;
          if(p.y<0||p.y>h) p.vy*=-1;
        });
        for(let i=0;i<particles.length;i++){
          for(let j=i+1;j<particles.length;j++){
            const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
            const dist = Math.sqrt(dx*dx+dy*dy);
            if(dist<125){
              ctx.strokeStyle = 'rgba(111,168,255,'+(0.10*(1-dist/125)).toFixed(3)+')';
              ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.stroke();
            }
          }
        }
        particles.forEach(sphere);
      }
      if(!reduceMotion) requestAnimationFrame(tick);
    }
    if(reduceMotion){ particles.forEach(sphere); } else { tick(); }
  }

  // ---- Animated count-up for numeric readouts (stat strip, score) ----
  // Called explicitly right after the DOM that contains these values is
  // written (see afterRender / finishAnalysis / report button), never via
  // a MutationObserver — observing a subtree that this same function keeps
  // rewriting was the previous bug: every write re-triggered the observer,
  // which restarted the animation from whatever half-finished number was
  // on screen, spawning more and more overlapping rAF loops until values
  // collapsed toward 0/negative and the tab hung.
  window.animateCounters = function animateCounters(scope){
    (scope||document).querySelectorAll('.stat-value, .score-value').forEach(el=>{
      if(el.dataset.counting === '1') return; // already animating, don't stack a second loop
      const raw = el.dataset.finalValue || el.textContent;
      const m = raw.match(/^\s*([\d,]+)([\s\S]*)$/);
      if(!m){ return; }
      const target = parseInt(m[1].replace(/,/g,''),10);
      if(isNaN(target)){ return; }
      const suffix = m[2];
      el.dataset.finalValue = raw; // remember the true target even if we're mid-animation on re-entry
      if(reduceMotion){ el.innerHTML = target.toLocaleString()+suffix; return; }
      el.dataset.counting = '1';
      const start = performance.now(), dur = 700;
      function step(now){
        const p = Math.min(1,(now-start)/dur);
        const eased = 1-Math.pow(1-p,3);
        el.innerHTML = Math.round(target*eased).toLocaleString()+suffix;
        if(p<1){ requestAnimationFrame(step); } else { el.dataset.counting = '0'; }
      }
      requestAnimationFrame(step);
    });
  };
  window.animateCounters();

  // ---- Shared custom chart tooltip (Threat Timeline / Risk Distribution / Category Comparison) ----
  // ONE tooltip element, ONE set of delegated listeners for the whole app —
  // works no matter how many times the charts re-render, with no per-render
  // listener setup/teardown needed.
  const tt = document.getElementById('chart-tooltip');
  if(tt){
    let ttW=0, ttH=0;
    const COLORS = {Phishing:'#ff8f33', 'BEC / Fraud':'#9b6bff', Impersonation:'#4c8dff'};
    function ttHtml(el){
      const type = el.dataset.ttType;
      if(type==='timeline'){
        const phish=el.dataset.phish, bec=el.dataset.bec, imp=el.dataset.imp, total=el.dataset.total;
        return `<div class="tt-title">${el.dataset.label}</div>
          <div class="tt-row"><span class="tt-dot" style="background:${COLORS.Phishing}"></span><span class="tt-label">Phishing</span><span class="tt-val">${Number(phish).toLocaleString()}</span></div>
          <div class="tt-row"><span class="tt-dot" style="background:${COLORS['BEC / Fraud']}"></span><span class="tt-label">BEC / Fraud</span><span class="tt-val">${Number(bec).toLocaleString()}</span></div>
          <div class="tt-row"><span class="tt-dot" style="background:${COLORS.Impersonation}"></span><span class="tt-label">Impersonation</span><span class="tt-val">${Number(imp).toLocaleString()}</span></div>
          <div class="tt-row tt-total"><span class="tt-label">Total</span><span class="tt-val">${Number(total).toLocaleString()}</span></div>`;
      }
      if(type==='donut'){
        return `<div class="tt-title">${el.dataset.label.toUpperCase()} RISK</div>
          <div class="tt-big" style="color:${el.dataset.ttColor}">${Number(el.dataset.value).toLocaleString()} emails</div>
          <div class="tt-row"><span class="tt-label">Share of volume</span><span class="tt-val">${el.dataset.pct}%</span></div>`;
      }
      if(type==='bar'){
        return `<div class="tt-title">${el.dataset.label.toUpperCase()}</div>
          <div class="tt-big" style="color:${el.dataset.ttColor}">${Number(el.dataset.value).toLocaleString()} threats</div>
          <div class="tt-row"><span class="tt-label">Of detected threats</span><span class="tt-val">${el.dataset.pct}%</span></div>`;
      }
      return '';
    }
    function positionTooltip(x,y){
      const vw = window.innerWidth, vh = window.innerHeight;
      let px = x+16, py = y+16;
      if(px+ttW > vw-8) px = x-ttW-16;
      if(py+ttH > vh-8) py = y-ttH-16;
      if(px<8) px=8; if(py<8) py=8;
      tt.style.transform = 'translate3d('+px+'px,'+py+'px,0)';
    }
    document.addEventListener('mouseover', e=>{
      const el = e.target.closest('[data-tt-type]');
      if(!el) return;
      tt.innerHTML = ttHtml(el);
      tt.classList.add('show');
      ttW = tt.offsetWidth; ttH = tt.offsetHeight;
      positionTooltip(e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', e=>{
      if(tt.classList.contains('show') && e.target.closest('[data-tt-type]')){
        positionTooltip(e.clientX, e.clientY);
      }
    }, {passive:true});
    document.addEventListener('mouseout', e=>{
      const el = e.target.closest('[data-tt-type]');
      if(!el) return;
      if(e.relatedTarget && e.relatedTarget.closest('[data-tt-type]')) return;
      tt.classList.remove('show');
    });
  }
})();
</script>
</body>
</html>
